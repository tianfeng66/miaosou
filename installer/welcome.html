<!DOCTYPE html>

<title>秒搜</title>
<style>
body { font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px; line-height: 1.55; color: #222; }
h1 { font-size: 18px; }
p { margin: 0 0 10px; }
</style>
</head>
<body>
<h1>秒搜</h1>
<p>macOS 上的文件名搜索工具，用法接近 Windows 的 Everything：打开后输入几个字，立刻列出匹配的文件。</p>
<p>点击「继续」将安装到「应用程序」文件夹。只在本机搜索，不会上传任何文件。</p>
<p>安装完成后，到启动台或「应用程序」里打开「秒搜」即可。</p>
<p>若系统提示「无法打开，因为无法验证开发者」：按住 Control 键点击图标，选择「打开」。需要搜「下载」等目录时，请在系统设置里给秒搜打开「完全磁盘访问权限」。</p>
</body>
</html>
